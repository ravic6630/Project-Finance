<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sampada — Your wealth, all in one place</title>
    <meta name="description" content="Track your Indian stocks, US stocks, mutual funds, cash and full personal finances in one place." />

    <!-- App identity: favicon, install icons, PWA manifest -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Sampada" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1626" />

    <!-- Social sharing (WhatsApp / LinkedIn / X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sampada" />
    <meta property="og:title" content="Sampada — Your wealth, all in one place" />
    <meta property="og:description" content="Stocks across 7 markets, mutual funds, cash, property and gold — tracked live, in your currency, with goals that tell you what it takes." />
    <meta property="og:url" content="https://sampada-j9hi.onrender.com/" />
    <meta property="og:image" content="https://sampada-j9hi.onrender.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sampada — Your wealth, all in one place" />
    <meta name="twitter:description" content="Stocks across 7 markets, mutual funds, cash, property and gold — tracked live, in your currency." />
    <meta name="twitter:image" content="https://sampada-j9hi.onrender.com/icons/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('sampada_theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
