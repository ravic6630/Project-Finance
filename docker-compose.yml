services:
  sampada:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    env_file:
      - .env.production
    volumes:
      # Persist the SQLite database + auto-generated JWT secret across restarts/redeploys.
      - sampada-data:/app/server/data
    restart: unless-stopped

volumes:
  sampada-data:
